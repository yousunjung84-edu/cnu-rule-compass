[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnu-rule-compass"
version = "1.6.0"
description = "CNU 규정 나침반 — 전남대 규정 근거 AI 안내 인프라 (검색·조문 인용·시점 질의 MCP)"
requires-python = ">=3.10"
# 핵심 기능(검색·CLI·테스트)은 표준 라이브러리만 사용한다.
dependencies = []

[project.optional-dependencies]
# MCP 서버 실행 시에만 필요. 검증 확인 버전: mcp 1.28.x
mcp = ["mcp>=1.20,<2"]   # 2.0.0에서 mcp.server.fastmcp 제거 — 상한 필수

[project.scripts]
cnu-rule-compass-mcp = "src.mcp_server:main"

[tool.setuptools]
packages = ["src"]
